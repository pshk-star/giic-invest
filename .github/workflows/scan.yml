name: GIIC scan

# Actualiza GIIC sin tu computadora: corre el scanner y escribe en Supabase.
# - cron: días hábiles ~22:40 UTC (después del cierre de EE. UU.).
# - workflow_dispatch: ejecución manual desde la pestaña Actions.
# El cron también mantiene activo el proyecto Supabase (evita la pausa por inactividad).
on:
  schedule:
    - cron: "40 22 * * 1-5"
  workflow_dispatch:
    inputs:
      enrich:
        description: "Activar enriquecimiento EODHD en esta corrida manual (true) — el cron usa la variable GIIC_EODHD_ENRICH"
        type: boolean
        default: false
# Producción SIEMPRE usa datos reales ('free'). No se expone opción 'sample': el job
# además rechaza por diseño publicar datos de ejemplo en Supabase.

permissions:
  contents: read

concurrency:
  group: giic-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias del job
        run: pip install -r requirements-job.txt
      - name: Ejecutar scanner y publicar en Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          BASE_CURRENCY: ${{ vars.BASE_CURRENCY || 'USD' }}
          # Enriquecimiento EODHD ACTIVADO para el cron (validado en la primera corrida general).
          #  - cron (schedule) → '1' (enriquecido, autónomo).
          #  - dispatch manual → el input `enrich` ('1' si true, '0' si false; útil para probar EDGAR-only).
          #  - KILL-SWITCH: fijar la variable de repo GIIC_EODHD_DISABLE=1 (Settings → Variables) apaga
          #    el enriquecimiento al instante, sin commit (rollback de futuras consultas/escrituras EODHD).
          GIIC_EODHD_ENRICH: ${{ (vars.GIIC_EODHD_DISABLE != '1' && (github.event_name == 'schedule' || github.event.inputs.enrich == 'true')) && '1' || '0' }}
        run: python -m app.jobs.run_scan --provider free --top 50
