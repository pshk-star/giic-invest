name: GIIC P2.3 cobertura del Opportunity Scanner (diagnóstico, solo lectura)

# Diagnóstico de cobertura real sobre Supabase. Solo lectura. No modifica reglas ni recomendaciones.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: Diagnóstico de cobertura del scanner
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m app.jobs.scanner_coverage_report
