name: GIIC Etapa A vista previa del Advisor unificado (solo lectura)

on:
  workflow_dispatch:
    inputs:
      fallback:
        description: "FCFF fallback (política P2.4)"
        type: boolean
        default: true
      save_profile:
        description: "Persistir perfil placeholder (demostrar round-trip settings→motor)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - name: Vista previa del Advisor
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FF_VALPOLICY: ${{ inputs.fallback && '1' || '0' }}
          SAVE_PROFILE: ${{ inputs.save_profile && '1' || '0' }}
        run: npm run advisor:preview
