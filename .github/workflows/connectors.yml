name: GIIC registro de conectores FDE (solo lectura)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connectors:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx pandas
      - name: Reporte del registro de conectores (solo lectura)
        env:
          EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
        run: python -m app.jobs.connector_registry_report
