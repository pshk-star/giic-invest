name: GIIC EDGAR point-in-time

# Ingesta de fundamentales SEC EDGAR con filing_date -> fundamentals_pit (append-only).
on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Tickers explícitos (opcional; vacío = cartera + universo)"
        type: string
        default: ""
      dry_run:
        type: boolean
        default: false
  schedule:
    - cron: "30 7 * * 6"   # semanal, sábado (los filings no cambian intradía)

permissions:
  contents: read

concurrency:
  group: giic-edgar-pit
  cancel-in-progress: false

jobs:
  edgar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-job.txt
      - name: Ingesta EDGAR PIT
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
            if [ -n "${{ inputs.tickers }}" ]; then ARGS="$ARGS --tickers ${{ inputs.tickers }}"; fi
          fi
          python -m app.jobs.edgar_pit $ARGS
