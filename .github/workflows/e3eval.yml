name: GIIC evaluación final E3 A/B (solo lectura)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e3eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx pandas
      - name: Evaluación final A/B (solo lectura)
        env:
          EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
        run: python -m app.jobs.e3_final_eval
