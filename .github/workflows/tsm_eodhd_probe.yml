name: GIIC TSM EODHD probe

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-job.txt
      - name: TSM EODHD probe
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
        run: python -m app.jobs.tsm_eodhd_probe
