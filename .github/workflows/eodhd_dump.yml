name: GIIC volcado fundamentales (manual, solo lectura)

# Vuelca el payload persistido (enrichment + history + núcleo) de los tickers indicados.
# SOLO LECTURA de Supabase: no escribe, no consulta EDGAR/EODHD. Evidencia para capturas P1.1.

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Tickers separados por coma"
        required: true
        default: "NVDA,META,TSM,ASML,JPM,RACE"
      prices:
        description: "Tickers para volcar historial de precios (opcional)"
        required: false
        default: ""
      advisor:
        description: "1 = volcar entradas del Advisor (operaciones, precios, scanner, fundamentales)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias mínimas
        run: |
          cd backend
          python -m pip install -q httpx
      - name: Volcar payloads (solo lectura)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GIIC_DUMP_TICKERS: ${{ github.event.inputs.tickers }}
          GIIC_PRICES_TICKERS: ${{ github.event.inputs.prices }}
          GIIC_ADVISOR_DUMP: ${{ github.event.inputs.advisor }}
        run: |
          cd backend
          if [ "${GIIC_ADVISOR_DUMP}" = "1" ]; then
            python -m app.jobs.eodhd_universe_report > ../adv.json
            echo "ADV_BYTES=$(wc -c < ../adv.json)"
            echo "===GIIC_ADV_BEGIN_B64==="
            base64 ../adv.json | sed 's/^/A64:/'
            echo "===GIIC_ADV_END_B64==="
          elif [ -n "${GIIC_PRICES_TICKERS}" ]; then
            python -m app.jobs.eodhd_universe_report > ../prices.json
            echo "PRICES_BYTES=$(wc -c < ../prices.json)"
            echo "===GIIC_PRICES_BEGIN_B64==="
            base64 ../prices.json | sed 's/^/P64:/'
            echo "===GIIC_PRICES_END_B64==="
          else
            python -m app.jobs.eodhd_universe_report > ../dump.json
            echo "DUMP_BYTES=$(wc -c < ../dump.json)"
            python -c "import json;d=json.load(open('../dump.json'));print('KEYS',{k:(list(v.keys()) if isinstance(v,dict) else v) for k,v in d.items()})"
            echo "===GIIC_DUMP_BEGIN_B64==="
            base64 ../dump.json | sed 's/^/B64:/'
            echo "===GIIC_DUMP_END_B64==="
          fi
      - name: Subir artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: giic-dump
          path: dump.json
          if-no-files-found: warn
